networks:
  app-network:
    driver: bridge

services:
  backend:
    container_name: gusto-eats-backend
    image: hojiakbar2806/gusto-eats-backend:latest
    command: /bin/sh -c " gunicorn -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000 app.main:app"
    expose:
      - 8000
    env_file:
      - backend/.env
    networks:
      - app-network
 
  frontend:
    container_name: gusto-eats-frontend
    image: hojiakbar2806/gusto-eats-frontend:latest
    expose:
      - 3000
    env_file:
      - frontend/.env
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: nginx
    depends_on:
      - frontend
      - backend
    ports:
      - "82:80" 
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf  
      - ./nginx/error-pages:/usr/share/nginx/html  
    networks:
      - app-network