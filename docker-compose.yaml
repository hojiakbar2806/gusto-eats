services:
  gusto-eats-backend:
    container_name: gusto-eats-backend
    image: hojiakbar2806/gusto-eats-backend:latest
    command: ["gunicorn","config.wsgi","-w 4", "-b 0.0.0.0:8000"]
    restart: always

  gusto-eats-frontend:
    container_name: gusto-eats-frontend
    image: hojiakbar2806/gusto-eats-frontend:latest
    restart: always

  gusto-eats-nginx:
    container_name: gusto-nginx
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    restart: always
    ports:
      - 80:80